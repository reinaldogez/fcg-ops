[project]
name = "fcg-e2e"
version = "1.0.0"
description = "Testes ponta a ponta da plataforma FCG pela borda publica"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "requests>=2.32",
    # assina os tokens forjados dos testes de recusa. o extra traz o backend
    # assimetrico, sem o qual o RS256 do emissor nao existe.
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["fcg*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes e pycodestyle. I: ordenacao de import. UP: sintaxe moderna.
# B: bugbear. SIM: simplificacoes. ANN: anotacao de tipo obrigatoria.
# BLE: captura larga de excecao, que aqui so se admite com justificativa escrita.
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
# fixture do pytest recebe outras fixtures por nome: anotar o retorno basta.
"conftest.py" = ["ANN401"]
# as declaracoes de um token sao JSON arbitrario: o tipo delas e Any de fato, e
# estreitar a anotacao mentiria sobre o que a forja aceita.
"borda/test_token.py" = ["ANN401"]
# atributo de item e resposta de interface de administracao tambem sao JSON
# arbitrario: quem consome e que sabe a forma esperada.
"fcg/leitura.py" = ["ANN401"]
"fcg/mensageria.py" = ["ANN401"]

[tool.pytest.ini_options]
testpaths = ["borda", "interno"]
# -ra mostra o resumo de tudo que nao passou; --strict-markers barra marcador
# escrito errado, que de outro modo viraria teste silenciosamente ignorado.
addopts = "-ra --strict-markers"
markers = [
    "saga: exercita a saga de compra ponta a ponta, com espera assincrona",
    "cache: observa o cache por dentro do cluster, e nao pela borda publica",
]
