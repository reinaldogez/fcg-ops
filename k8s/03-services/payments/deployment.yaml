apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: fcg
spec:
  replicas: 1
  # Com uma replica, o pod novo sobe e fica pronto antes de o antigo sair.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
    spec:
      terminationGracePeriodSeconds: 20
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-payments 5432; do sleep 2; done']
      containers:
        - name: payments-api
          image: ghcr.io/reinaldogez/fcg-payments:latest
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: payments-config
            - configMapRef:
                name: payments-env
            - secretRef:
                name: payments-secret
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 5
          # O endpoint sai do Ingress antes de o processo parar de aceitar conexao: a
          # espera cobre a propagacao da remocao, e so depois o sinal de parada chega.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
