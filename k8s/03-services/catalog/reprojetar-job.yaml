apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-reprojetar
  namespace: fcg
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: catalog
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-catalog 5432; do sleep 2; done']
      containers:
        - name: reprojetar
          image: ghcr.io/reinaldogez/fcg-catalog:latest
          # --reprojetar: reconstroi a biblioteca no read model a partir do relacional,
          # escrevendo pela mesma porta do caminho de evento e sem apagar nada. Operacao
          # sob demanda — este Job nao entra na subida automatica do cluster.
          command: ["dotnet", "Fcg.Catalog.Api.dll", "--reprojetar"]
          envFrom:
            - configMapRef:
                name: catalog-config
            - configMapRef:
                name: catalog-env
            - secretRef:
                name: catalog-secret
