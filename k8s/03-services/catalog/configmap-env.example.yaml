apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-env
  namespace: fcg
data:
  # Valores que MUDAM entre o cluster local e o da nuvem. O configmap.yaml ao lado
  # guarda so o que e identico nos dois; o que varia mora aqui, gerado a partir do
  # .env por scripts/init-secrets.sh e nunca versionado.
  # Local: rabbitmq / 5672 / false. Nuvem: endpoint do broker gerenciado / 5671 / true.
  RabbitMq__Host: "REPLACE_ME"
  RabbitMq__Port: "REPLACE_ME"
  RabbitMq__UseSsl: "REPLACE_ME"
  # Precisa casar EXATAMENTE com o emissor do identity — token de emissor diferente
  # do esperado e rejeitado aqui.
  Jwt__Issuer: "REPLACE_ME"
  # Endpoint do emulador do read model no local; vazia na nuvem, onde o SDK resolve
  # o servico gerenciado pela regiao. Pode ficar vazia, mas precisa estar declarada.
  DynamoDb__ServiceUrl: ""
  # Busca: as duas chaves existem so na nuvem. No local ficam ausentes, e a ausencia e o
  # que desliga a busca no servico. O endpoint vem do output opensearch_endpoint do root
  # session, com https:// na frente e sem barra final; o dominio so aceita requisicao
  # assinada, por isso a assinatura acompanha o endpoint.
  # OpenSearch__Endpoint: "REPLACE_ME"
  # OpenSearch__UseSigV4: "true"
