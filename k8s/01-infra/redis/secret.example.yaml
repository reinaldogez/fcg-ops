apiVersion: v1
kind: Secret
metadata:
  name: redis-secret
  namespace: fcg
type: Opaque
stringData:
  # Senha pura usada pelo --requirepass do servidor Redis.
  # Deve ser a MESMA senha usada pelo cliente que consome este Redis,
  # analogamente ao SA password do identity. Aqui mora só a senha.
  REDIS_PASSWORD: "REPLACE_ME"
