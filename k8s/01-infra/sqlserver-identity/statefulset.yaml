apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver-identity
  namespace: fcg
spec:
  serviceName: sqlserver-identity
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver-identity
  template:
    metadata:
      labels:
        app: sqlserver-identity
    spec:
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
          envFrom:
            - secretRef:
                name: sqlserver-identity-secret
          # A porta 1433 abre antes de o engine autenticar e de os bancos sairem do
          # recovery. Pronto = nenhum banco fora de ONLINE (mesma condicao do healthcheck
          # do Compose); ate la o Service nao roteia para o pod.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
                  -P "$MSSQL_SA_PASSWORD" -C -h -1 -W
                  -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE state_desc <> 'ONLINE'"
                  | grep -qx 0
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
