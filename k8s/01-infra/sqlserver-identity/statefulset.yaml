apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sqlserver-identity
  namespace: fcg
spec:
  serviceName: sqlserver-identity
  replicas: 1
  selector:
    matchLabels:
      app: sqlserver-identity
  template:
    metadata:
      labels:
        app: sqlserver-identity
    spec:
      # O SQL Server roda como uid 10001 e o volume de bloco nasce com raiz de root; sem o
      # grupo dono o processo nao escreve no proprio diretorio de dados. O storage local
      # do k3d mascarava isso, porque nasce aberto para todos.
      securityContext:
        fsGroup: 10001
      containers:
        - name: sqlserver
          image: mcr.microsoft.com/mssql/server:2022-latest
          resources:
            requests:
              cpu: 100m
              memory: 1152Mi
            limits:
              memory: 2Gi
          ports:
            - containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: "Y"
            # Sem teto o SQL Server cresce ate ~80% da memoria que enxerga, que e a do no
            # inteiro e nao o limite do conteiner.
            - name: MSSQL_MEMORY_LIMIT_MB
              value: "1536"
          envFrom:
            - secretRef:
                name: sqlserver-identity-secret
          # A porta 1433 abre antes de o engine autenticar e de os bancos sairem do
          # recovery. Pronto = nenhum banco fora de ONLINE (mesma condicao do healthcheck
          # do Compose); ate la o Service nao roteia para o pod.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
                  -P "$MSSQL_SA_PASSWORD" -C -h -1 -W
                  -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM sys.databases WHERE state_desc <> 'ONLINE'"
                  | grep -qx 0
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/opt/mssql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
