apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: fcg
type: Opaque
stringData:
  # Credenciais do admin do Grafana. O valor real e injetado fora do git pelo
  # init-secrets.sh a partir do .env; aqui mora so o placeholder.
  GF_SECURITY_ADMIN_USER: "REPLACE_ME"
  GF_SECURITY_ADMIN_PASSWORD: "REPLACE_ME"
